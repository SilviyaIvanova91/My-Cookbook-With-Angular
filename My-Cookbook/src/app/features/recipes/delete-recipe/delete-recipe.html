<section class="delete-page">
  <title>Delete Recipe</title>

  <div class="modal">
    <h2>Confirm Delete</h2>

    <img
      class="recipe-img"
      [src]="recipe.imageUrl || 'https://via.placeholder.com/400x200'"
      [alt]="recipe.name || 'Recipe Image'"
    />

    <div class="recipe-name">{{ recipe.name }}</div>

    <div class="message">Are you sure you want to delete this recipe?</div>

    <div class="buttons">
      <button class="cancel" (click)="onCancel()">Cancel</button>
      <button class="delete" (click)="onDelete()">Delete</button>
    </div>
  </div>
</section>
