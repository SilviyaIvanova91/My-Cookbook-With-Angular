<div class="recipes-list">
  @if (user) {
    <div class="create-button">
      <button class="create-recipe-btn" routerLink="/new-recipe">
        <span>➕</span>Create Recipe
      </button>
    </div>
  }
  <h1 class="h-recipes">Recipes</h1>
  <div class="recipes">
    @if (isLoading$ | async) {
      <p>Loading recipes...</p>
    }
    @for (recipe of recipes$ | async; track recipe._id) {
      <app-recipe [recipe]="recipe" />
    }
  </div>
</div>
